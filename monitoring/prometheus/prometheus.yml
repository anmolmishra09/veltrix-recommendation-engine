global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'recommendation_api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scheme: http
    scrape_interval: 5s

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']
    scrape_interval: 15s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 15s

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 15s

  - job_name: 'mlflow'
    static_configs:
      - targets: ['mlflow:5000']
    scrape_interval: 15s

  - job_name: 'feast'
    static_configs:
      - targets: ['feast:6565']
    scrape_interval: 15s

  - job_name: 'spark-master'
    static_configs:
      - targets: ['spark-master:8080']
    scrape_interval: 15s

  - job_name: 'spark-worker'
    static_configs:
      - targets: ['spark-worker:8081']
    scrape_interval: 15s

  - job_name: 'airflow-webserver'
    static_configs:
      - targets: ['airflow-webserver:8080']
    scrape_interval: 15s

  - job_name: 'airflow-scheduler'
    static_configs:
      - targets: ['airflow-scheduler:8081']
    scrape_interval: 15s

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']  # For host metrics
    scrape_interval: 15s

  - job_name: 'business-metrics'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics/business'
    scrape_interval: 5s

  - job_name: 'ml-metrics'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics/ml'
    scrape_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - "alerts.yml"