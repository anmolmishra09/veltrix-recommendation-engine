# Alembic Configuration
[alembic]
# path to migration scripts
script_location = database/migrations

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python-dateutil library that can be
# installed by adding `python-dateutil` to requirements.txt
# timezone =

# max length of characters to apply to the
# "window" function when attempting to resolve pks/fks
# length = 60

# set to 'True' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'True' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions directory
# sourceless = false

# version path separator
# As mentioned above, the value here is expected to be
# the separator found between multiple version locations.
# version_path_separator =

# output encoding used when revision files
# are written from script_location
# output_encoding = utf-8

sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/recommendation_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s