apiVersion: v1
kind: ConfigMap
metadata:
  name: recommendation-platform-config
  namespace: recommendation-platform
  labels:
    app: recommendation-platform
data:
  # Application Configuration
  ENVIRONMENT: "production"
  DEBUG: "false"

  # Database Configuration
  DATABASE_URL: "postgresql://postgres:postgres@postgres.recommendation-platform.svc.cluster.local:5432/recommendation_db"

  # Redis Configuration
  REDIS_URL: "redis://redis.recommendation-platform.svc.cluster.local:6379/0"

  # Kafka Configuration
  KAFKA_BOOTSTRAP_SERVERS: "kafka.recommendation-platform.svc.cluster.local:9092"

  # MLflow Configuration
  MLFLOW_TRACKING_URI: "http://mlflow.recommendation-platform.svc.cluster.local:5000"

  # Feature Store Configuration
  FEAST_REPO_PATH: "/feast/feast_repository"

  # S3/MinIO Configuration
  S3_ENDPOINT: "http://minio.recommendation-platform.svc.cluster.local:9000"
  S3_ACCESS_KEY: "minio"
  S3_SECRET_KEY: "minio123"
  S3_BUCKET: "mlflow"

  # API Configuration
  API_HOST: "0.0.0.0"
  API_PORT: "8000"

  # Model Configuration
  MODEL_EMBEDDING_DIM: "64"
  MODEL_BATCH_SIZE: "256"
  MODEL_LEARNING_RATE: "0.001"
  MODEL_EPOCHS: "10"
  MODEL_SEED: "42"

  # Recommendation Configuration
  REC_DEFAULT_K: "10"
  REC_MAX_K: "100"
  REC_RANKING_MODEL_TYPE: "xgboost"