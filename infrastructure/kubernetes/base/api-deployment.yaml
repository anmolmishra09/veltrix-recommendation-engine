apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-api
  namespace: recommendation-platform
  labels:
    app: recommendation-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recommendation-api
  template:
    metadata:
      labels:
        app: recommendation-api
    spec:
      containers:
        - name: api
          image: recommendation-platform-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: recommendation-platform-config
            - secretRef:
                name: recommendation-platform-secrets
          volumeMounts:
            - name: model-storage
              mountPath: /app/models
            - name: database-scripts
              mountPath: /app/database
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: model-storage-pvc
        - name: database-scripts
          configMap:
            name: database-init-scripts