apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-consumer
  namespace: recommendation-platform
  labels:
    app: recommendation-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendation-consumer
  template:
    metadata:
      labels:
        app: recommendation-consumer
    spec:
      containers:
        - name: consumer
          image: recommendation-platform-consumer:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: recommendation-platform-config
            - secretRef:
                name: recommendation-platform-secrets
          volumeMounts:
            - name: model-storage
              mountPath: /app/models
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: model-storage-pvc