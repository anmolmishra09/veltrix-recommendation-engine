apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: recommendation-platform-ingress
  namespace: recommendation-platform
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
    - host: recommendation-platform.example.com
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: recommendation-api
                port:
                  number: 80
          - path: /(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: recommendation-frontend
                port:
                  number: 80