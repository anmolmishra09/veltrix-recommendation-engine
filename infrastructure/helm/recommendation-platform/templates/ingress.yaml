{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "recommendation-platform.fullname" . }}-ingress
  labels:
    {{- include "recommendation-platform.selectorLabels" . | nindent 4 }}
{{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "recommendation-platform.fullname" $ }}-{{ if eq .path "/api" }}api{{ else }}frontend{{ end }}
                port:
                  number: {{ if eq .path "/api" }}{{ .Values.api.service.port }}{{ else }}{{ .Values.frontend.service.port }}{{ end }}
          {{- end }}
    {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
{{- end }}